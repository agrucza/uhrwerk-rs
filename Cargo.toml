[workspace]
resolver = "2"
members = [
    "app-core",
    "drivers",
    "nfc",
    "firmware-hal",
    "system-core",
    "firmware-s3",
    "firmware-c6",
    "firmware-twatch-ultra",
    "tools/fontbake",
]
# firmware-c6 is excluded from default-members so `cargo build
# --workspace` at the root (which runs under the `esp` Xtensa
# toolchain) doesn't try to compile a RISC-V target with the wrong
# toolchain. Build it explicitly from inside firmware-c6/ - its own
# rust-toolchain.toml switches rustup to stable for that directory.
default-members = [
    "app-core",
    "drivers",
    "nfc",
    "firmware-hal",
    "system-core",
    "firmware-s3",
    "firmware-twatch-ultra",
]
# Soft fork of esp-hal: 1.1.0-rc.0 plus the fix for the C6
# post-WiFi light-sleep freeze and its sleep-entry diagnostics - see
# docs/esp-hal-patch.md for the investigation record and the exact
# delta. The fork keeps the same version number, so every crate in
# the graph (esp-rtos, esp-radio, esp-storage, ...) sees one esp-hal.
# Upstream syncs are merges of release commits into the fork's
# `uhrwerk-rs` branch. Drop this block the moment an upstream release
# carries an equivalent fix.
[patch.crates-io]
esp-hal = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
# esp-hal's in-tree sibling crates must come from the same source:
# the git esp-hal pulls them from its own repo, and without these
# entries the registry crates (esp-radio, esp-rtos, ...) would pull
# second copies from crates.io - cargo then rejects the duplicate
# `links` natives (xtensa-lx-rt/esp-riscv-rt) or splits types across
# two instances. Same repo, same branch, same versions as the
# registry releases (the branch base is the release commit).
esp-rom-sys            = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
esp-config             = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
esp-metadata-generated = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
esp-sync               = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
esp-hal-procmacros     = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
esp-riscv-rt           = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
xtensa-lx              = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }
xtensa-lx-rt           = { git = "https://github.com/agrucza/esp-hal", branch = "uhrwerk-rs" }

# Shared dependency versions - single source of truth to avoid mismatches.
[workspace.dependencies]
defmt                  = "0.3"
embedded-hal           = "1.0.0"
embedded-hal-async     = "1.0.0"
embedded-graphics-core = "0.4.1"
log                    = { version = "0.4.29", default-features = false }

[profile.dev]
opt-level     = "s"
codegen-units = 1
debug         = true

[profile.release]
opt-level     = "s"
codegen-units = 1
lto           = "fat"
# Keep debug symbols in ELF for espflash panic symbolication.
# They are stripped from the flash image automatically.
debug         = 2

# esp-radio's docs require optimization level 2/3 for the radio glue
# regardless of the profile - below that the WiFi blob's timing
# assumptions break and association can fail outright.
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3
